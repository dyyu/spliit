name: Deploy

on:
  push:
    branches: ['main']
    # Documentation cannot change what gets deployed. workflow_dispatch stays
    # available for deploying a commit that only touched these.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

# Never let two production deploys (or two migration runs) overlap.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check TypeScript types
        run: npm run check-types

      - name: Check ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run check-formatting

      - name: Run tests
        run: npm test

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: production

    # Plain identifiers, not credentials — kept as repository variables so they
    # appear in logs. Only VERCEL_TOKEN authenticates and needs to be a secret.
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Downloads project settings and production env vars into
      # .vercel/.env.production.local, so Vercel stays the source of truth for
      # ordinary configuration. The database URLs are the exception: they are
      # stored on Vercel as Sensitive so nobody can read them back, which means
      # they arrive here as the literal string [SENSITIVE]. Strip those lines so
      # they cannot shadow the real values, which come from GitHub secrets.
      - name: Pull Vercel environment
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          grep -v '\[SENSITIVE\]' .vercel/.env.production.local > .vercel/.env.build || true
          echo "Usable variables pulled from Vercel (names only):"
          grep -v '^#' .vercel/.env.build | cut -d= -f1 | sort

      - name: Install dependencies
        run: npm ci

      # Runs before the build so the schema is in place by the time the new
      # code is live. A failure here aborts the deploy. Prisma connects via
      # directUrl (POSTGRES_URL_NON_POOLING) for migrations, but requires both
      # to be set.
      - name: Apply database migrations
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: npx prisma migrate deploy

      # src/lib/env.ts validates env at module load during `next build`, so the
      # database URLs must be in the process environment even though nothing is
      # prerendered from the database and no connection is opened here.
      - name: Build
        env:
          POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
          POSTGRES_URL_NON_POOLING: ${{ secrets.POSTGRES_URL_NON_POOLING }}
        run: |
          set -a
          . .vercel/.env.build
          set +a
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
